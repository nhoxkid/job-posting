services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-job_posting}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # Use the Postgres container (the whole point of the compose stack).
      DB_DRIVER: postgres
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-job_posting}
    ports:
      - '${SERVER_PORT:-4000}:4000'
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      args:
        # Baked into the static bundle at build time; the browser calls the
        # API on the host-published port, not the internal compose network.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:4000/api}
    restart: unless-stopped
    ports:
      - '${CLIENT_PORT:-5173}:80'
    depends_on:
      - server

volumes:
  db-data:
