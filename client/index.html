<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <title>RoleVault — find internships that fit</title>
    <!--
      Apply the stored theme before first paint. React sets the same class in an
      effect, which runs after the browser has already painted — without this a
      dark-mode visitor sees a white flash on every reload. Reads the same
      `theme` key and resolution rules as ThemeProvider; keep the two in step.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('theme')
          if (stored !== 'light' && stored !== 'dark' && stored !== 'system') stored = 'system'
          var dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* Private mode / storage disabled — fall through to the light default. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
